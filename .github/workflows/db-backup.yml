name: db-backup

on:
  schedule:
    - cron: "0 18 * * *" # 01:00 giờ VN
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # Supabase chạy Postgres 17; postgresql-client mặc định của Ubuntu runner
      # chỉ có bản 16 — pg_dump từ chối dump vì "server version mismatch".
      # Thêm kho PGDG để cài đúng postgresql-client-17.
      - name: Cài postgresql-client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: pg_dump
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          # Gọi thẳng binary bản 17 — lệnh pg_dump trần trên PATH vẫn
          # resolve về bản 16 mặc định của Ubuntu dù đã cài thêm bản 17.
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges "$DIRECT_URL" \
            > "heyp-$(date -u +%Y%m%d-%H%M).sql"
          ls -lh heyp-*.sql

      - name: Lưu artifact
        uses: actions/upload-artifact@v4
        with:
          name: heyp-db-dump
          path: heyp-*.sql
          retention-days: 30
